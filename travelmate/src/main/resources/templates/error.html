<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Không thể mở trang - TravelMate</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&subset=vietnamese&display=swap"
          rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            font-family: "Montserrat", Arial, sans-serif;
            background: #f4f7fb;
            color: #0f172a;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }
        .error-panel {
            width: min(760px, 100%);
            background: #fff;
            border: 1px solid #dbe4f0;
            border-radius: 8px;
            padding: 34px;
            box-shadow: 0 18px 45px rgba(15, 23, 42, 0.08);
        }
        .brand {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 24px;
            color: #0284c7;
            font-size: 1.15rem;
            font-weight: 800;
            text-decoration: none;
        }
        .brand i {
            width: 38px;
            height: 38px;
            border-radius: 8px;
            background: #0284c7;
            color: #fff;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }
        .brand span:last-child { color: #f59e0b; }
        .status {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 12px;
            border-radius: 999px;
            border: 1px solid #bfdbfe;
            background: #eff6ff;
            color: #1d4ed8;
            font-size: .85rem;
            font-weight: 800;
            margin-bottom: 16px;
        }
        h1 {
            margin: 0 0 12px;
            font-size: clamp(1.7rem, 4vw, 2.35rem);
            line-height: 1.15;
            letter-spacing: 0;
        }
        p {
            margin: 0;
            color: #475569;
            font-size: 1rem;
            line-height: 1.7;
        }
        .hint {
            margin-top: 18px;
            padding: 14px 16px;
            border-radius: 8px;
            border: 1px solid #fde68a;
            background: #fffbeb;
            color: #92400e;
            font-size: .95rem;
            line-height: 1.6;
        }
        .actions {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-top: 26px;
        }
        .btn {
            min-height: 44px;
            border-radius: 8px;
            padding: 0 18px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-weight: 800;
            text-decoration: none;
            border: 1px solid transparent;
        }
        .btn-primary { background: #2563eb; color: #fff; }
        .btn-ghost { background: #fff; color: #2563eb; border-color: #bfdbfe; }
        @media (max-width: 560px) {
            .error-panel { padding: 24px; }
            .btn { width: 100%; }
        }
    </style>
</head>

<body>
    <main class="error-panel">
        <a href="/" class="brand" aria-label="TravelMate">
            <i class="fa-solid fa-building"></i>
            <span>TRAVEL</span><span>MATE</span>
        </a>

        <div class="status">
            <i class="fa-solid fa-circle-info"></i>
            <span th:text="${status != null ? 'Mã lỗi ' + status : 'Không thể xử lý yêu cầu'}">Mã lỗi</span>
        </div>

        <h1>Trang này chưa thể mở theo cách hiện tại</h1>
        <p>
            Yêu cầu vừa rồi không đủ thông tin hoặc không đúng thao tác cần thiết.
            Bạn có thể quay lại trang trước đó và thực hiện lại thao tác.
        </p>

        <div class="hint" th:if="${path != null}">
            Đường dẫn vừa gặp lỗi: <strong th:text="${path}">/booking/confirm</strong>
        </div>

        <div class="actions">
            <a class="btn btn-primary" href="/accommodations">
                <i class="fa-solid fa-magnifying-glass"></i>
                Chọn lại chỗ ở
            </a>
            <a class="btn btn-ghost" href="/">
                <i class="fa-solid fa-house"></i>
                Về trang chủ
            </a>
        </div>
    </main>
</body>

</html>
