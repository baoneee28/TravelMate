# Compatibility marker for older local launch configurations.
# Google OAuth is now guarded centrally in GoogleOAuthClientConfig:
# - no profile is required;
# - a Google client is registered only when GOOGLE_OAUTH_ENABLED=true
#   and both GOOGLE_CLIENT_ID / GOOGLE_CLIENT_SECRET are non-empty.
#
# Google Cloud redirect URI:
#   http://localhost:8080/login/oauth2/code/google
