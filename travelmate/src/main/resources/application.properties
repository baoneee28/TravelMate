# =============================================
# TravelMate - Application Configuration
# Spring Boot MVC + Thymeleaf + MySQL
# =============================================

spring.application.name=travelmate

# --- Local secrets/config (ignored by Git) ---
# Allows running locally without typing env vars every time.
# The duplicate travelmate/ path supports launching from either the module folder or repo root.
spring.config.import=optional:file:.env.local[.properties],optional:file:.env[.properties],optional:file:travelmate/.env.local[.properties],optional:file:travelmate/.env[.properties]

# --- Server Port (chay 1 cong duy nhat) ---
server.port=8080

# --- MySQL Database ---
# DEMO/SANDBOX ONLY. Production must load DB credentials from environment variables
# or application-secret.properties (not committed to source control).
# Thay ten database, username, password cho dung voi may cua ban
spring.datasource.url=jdbc:mysql://localhost:3306/travelmate_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=Asia/Ho_Chi_Minh&allowPublicKeyRetrieval=true&zeroDateTimeBehavior=convertToNull&useUnicode=true&characterEncoding=UTF-8&connectionCollation=utf8mb4_unicode_ci
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- JPA / Hibernate ---
# update: tu dong cap nhat bang theo entity (dung cho dev)
# validate: chi kiem tra, khong tao bang (dung cho production)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# --- Thymeleaf ---
# Cache: false khi dev (hot reload duoc), true khi production
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.mode=HTML

# --- Server Encoding (bắt buộc UTF-8 cho tất cả HTTP responses) ---
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true
server.servlet.encoding.force-request=true
server.servlet.encoding.force-response=true
spring.messages.encoding=UTF-8

# --- Static Resources (CSS / JS / Images) ---
spring.web.resources.static-locations=classpath:/static/
spring.web.resources.cache.period=0

# --- Multipart File Upload (cho phép partner upload ảnh) ---
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=20MB

# --- Logging ---
logging.level.org.springframework.security=WARN
logging.level.org.thymeleaf=ERROR
logging.level.org.springframework.web=WARN
logging.file.name=logs/travelmate.log
logging.level.root=ERROR
logging.level.com.travelmate=INFO
logging.level.org.springframework.security.config.annotation.authentication.configuration.InitializeUserDetailsBeanManagerConfigurer=ERROR
logging.charset.console=UTF-8
logging.charset.file=UTF-8

# =============================================
# Chatbot AI (Groq)
# =============================================
# Key lay tu bien moi truong GROQ_API_KEY, khong commit truc tiep vao source.
travelmate.chatbot.groq.enabled=${GROQ_CHATBOT_ENABLED:true}
travelmate.chatbot.groq.api-key=${GROQ_API_KEY:}
travelmate.chatbot.groq.base-url=${GROQ_BASE_URL:https://api.groq.com/openai/v1}
travelmate.chatbot.groq.model=${GROQ_MODEL:llama-3.3-70b-versatile}

# --- JPA Open In View (giu session mo trong suot request, ngan LazyInitializationException) ---
spring.jpa.open-in-view=true

# --- Partner Settlement Demo Mode ---
# true: cho phep Admin demo xac nhan chi tra settlement truoc ngay mung 10.
# false: khoa thanh toan neu chua toi scheduled_payout_date.
travelmate.demo-mode=${TRAVELMATE_DEMO_MODE:true}

# --- Forgot Password Email / Demo ---
# auto: tự gửi email thật khi SMTP đã cấu hình đủ; nếu thiếu SMTP thì trả thông báo chung, không lộ email.
# enabled: bắt buộc dùng SMTP nếu đã cấu hình đủ; disabled: không gửi mail, chỉ dùng demo link nếu bật riêng.
travelmate.app-base-url=${TRAVELMATE_APP_BASE_URL:http://localhost:8080}
travelmate.password-reset.email-enabled=${TRAVELMATE_PASSWORD_RESET_EMAIL_ENABLED:auto}
travelmate.password-reset.show-demo-link=${TRAVELMATE_PASSWORD_RESET_DEMO_LINK:false}
spring.mail.host=${SMTP_HOST:}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
travelmate.mail.from=${TRAVELMATE_MAIL_FROM:${SMTP_USERNAME:}}

# =============================================
# Google OAuth2 Login (Optional Demo)
# =============================================
# App tự bật Google Login khi có đủ Client ID/Secret. Nếu muốn tắt chủ động, đặt GOOGLE_OAUTH_ENABLED=false.
# Redirect URI tren Google: http://localhost:8080/login/oauth2/code/google
travelmate.oauth2.google.enabled=${GOOGLE_OAUTH_ENABLED:true}
travelmate.oauth2.google.client-id=${GOOGLE_CLIENT_ID:}
travelmate.oauth2.google.client-secret=${GOOGLE_CLIENT_SECRET:}

# =============================================
# VNPAY Sandbox Configuration
# =============================================
# Load sandbox credentials from environment variables before running payment flow.
# See docs/demo-env.example for the variables needed on another machine.
vnpay.tmn-code=${VNPAY_TMN_CODE:}
vnpay.hash-secret=${VNPAY_HASH_SECRET:}
vnpay.pay-url=https://sandbox.vnpayment.vn/paymentv2/vpcpay.html
vnpay.version=2.1.0
vnpay.command=pay
vnpay.order-type=other
vnpay.expire-minutes=3

# --- Return URL ---
# VNPAY redirect browser cua user ve day sau khi thanh toan.
# Chay local: dung localhost
# Demo tren may khac / ngrok: doi thanh URL cong khai tuong ung
vnpay.return-url=${VNPAY_RETURN_URL:http://localhost:8080/payment/vnpay-return}
# localhost (khong co ngrok): vnpay.return-url=http://localhost:8080/payment/vnpay-return

# --- IPN URL (server-to-server callback) ---
# VNPAY goi thang vao server nay de xac nhan giao dich (khong qua browser).
# Can co URL cong khai (ngrok / Cloudflare Tunnel / VPS) de VNPAY goi duoc.
#
# CACH CAI NGROK (Windows):
#   1. Tai va cai dat ngrok: https://ngrok.com/download
#   2. Dang ky free account, lay authtoken: https://dashboard.ngrok.com/get-started/your-authtoken
#   3. Chay trong terminal: ngrok config add-authtoken <YOUR_AUTHTOKEN>
#   4. Chay tunnel:         ngrok http 8080
#   5. Copy "Forwarding" URL (vd: https://abc123.ngrok-free.app)
#   6. Thay the dong nay:
vnpay.ipn-url=${VNPAY_IPN_URL:http://localhost:8080/payment/vnpay-ipn}
# localhost (khong co ngrok): vnpay.ipn-url=http://localhost:8080/payment/vnpay-ipn
#
# LUU Y: Khi khong co ngrok, Return URL van xu ly duoc ket qua (idempotent).
# He thong van hoat dong day du voi localhost, chi can ngrok cho IPN that.

# =============================================
# Scheduling (BookingExpiryScheduler)
# =============================================
spring.task.scheduling.pool.size=2
