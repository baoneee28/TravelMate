# localhost (khong co ngrok): vnpay.ipn-url=http://localhost:8080/payment/vnpay-ipn
#
# LUU Y: Khi khong co ngrok, Return URL van xu ly duoc ket qua (idempotent).
# He thong van hoat dong day du voi localhost, chi can ngrok cho IPN that.

