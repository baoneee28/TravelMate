# --- IPN URL (server-to-server callback) ---
# VNPAY goi thang vao server nay de xac nhan giao dich (khong qua browser).
# Can co URL cong khai (ngrok / Cloudflare Tunnel / VPS) de VNPAY goi duoc.
#
# CACH CAI NGROK (Windows):
#   1. Tai va cai dat ngrok: https://ngrok.com/download
#   2. Dang ky free account, lay authtoken: https://dashboard.ngrok.com/get-started/your-authtoken
#   3. Chay trong terminal: ngrok config add-authtoken <YOUR_AUTHTOKEN>
#   4. Chay tunnel:         ngrok http 8080
#   5. Copy "Forwarding" URL (vd: https://abc123.ngrok-free.app)
#   6. Thay the dong nay:
