# =============================================
# TravelMate - Application Configuration
# Spring Boot MVC + Thymeleaf + MySQL
# =============================================

spring.application.name=travelmate

# --- Server Port (chay 1 cong duy nhat) ---
server.port=8080

# --- MySQL Database ---
# Thay ten database, username, password cho dung voi may cua ban
spring.datasource.url=jdbc:mysql://localhost:3306/travelmate_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=Asia/Ho_Chi_Minh&allowPublicKeyRetrieval=true&zeroDateTimeBehavior=convertToNull
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- JPA / Hibernate ---
# update: tu dong cap nhat bang theo entity (dung cho dev)
# validate: chi kiem tra, khong tao bang (dung cho production)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# --- Thymeleaf ---
# Cache: false khi dev (hot reload duoc), true khi production
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.mode=HTML

# --- Server Encoding (bắt buộc UTF-8 cho tất cả HTTP responses) ---
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true
server.servlet.encoding.force-response=true

# --- Static Resources (CSS / JS / Images) ---
spring.web.resources.static-locations=classpath:/static/
spring.web.resources.cache.period=0

# --- Multipart File Upload (cho phép partner upload ảnh) ---
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=20MB

# --- Logging ---
logging.level.com.travelmate=DEBUG
logging.level.org.springframework.security=WARN
logging.level.org.thymeleaf=ERROR
logging.level.org.springframework.web=WARN
logging.file.name=logs/travelmate.log
logging.level.root=ERROR
logging.level.com.travelmate=DEBUG

# --- JPA Open In View (giu session mo trong suot request, ngan LazyInitializationException) ---
spring.jpa.open-in-view=true

